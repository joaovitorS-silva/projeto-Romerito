<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Início | Cafeteria</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="hero__section">
      <nav class="navbar">
        <a class="navbar__link navbar__link--active" href="home.html">Início</a>
        <a class="navbar__link" href="products.html">Produtos</a>
        <a class="navbar__link" href="reviews.html">Avaliações</a>
        <a class="navbar__link" href="facility.html">Ajuda</a>
      </nav>

      <main>
        <section class="inicio">
          <div class="inicio__imagem">
            <img
              class="inicio__imagem"
              src="image/imagem_hero.jpg"
              alt="café hero"
            />
          </div>
          <div class="inicio__texto">
            <h1 class="inicio__titulo">Neabi Coffee</h1>
            <p class="inicio__descricao">
              Comece o dia com mais sabor e energia. Descubra nossos cafés
              especiais, preparados com grãos selecionados para proporcionar uma
              experiência única a cada xícara.
            </p>
            <div class="hero__badge">
              <span>Veja mais</span>
              <button class="hero__badge__icon">
                <img
                  class="icons"
                  src="image/seta-diagonal.png"
                  alt="seta-diagonal"
                />
              </button>
            </div>
          </div>
        </section>
        <section class="hero__footer">
          <div class="footer__estatisticas">
            <div class="footer__texto">
              <h2 class="hero__texto--destaque">1K+</h2>
              <p>Reviews</p> 
            </div>

            <div class="footer__texto">
              <h2 class="hero__texto--destaque">3k+</h2>
              <p>Best sell</p>
            </div>

            <div class="footer__texto">
              <h2 class="hero__texto--destaque">150+</h2>
              <p>Menu</p>
            </div>
          </div>
          <img
            class="footer__imagem"
            src="/image/cafe__papel-removebg-preview.png"
            alt=""
          />
        </section>
      </main>
    </section>
  </body>
</html>
